<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixa</title>
    <style>
        h1 {
            background-color: #9eafe4;
            height: 300px;
            width: 300px;
            
            border: 10px solid #ff0000;

            padding: 10px 10px 10px 10px;

            margin: 10px solid #0a0a0a;

            outline: 10px solid #6f00ff;
        }
        a {
            background-color: #a8b9ec;
            
            border: 5px solid #ff0000;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p> caixas box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona</p>
    
</body>
</html>
