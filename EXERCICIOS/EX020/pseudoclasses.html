<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        body {
            margin: 20px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        div {
            display: inline-block;
            background-color: #d9b5ee;
            border: 1px solid #000;
            text-align: center;
            height: 200px;
            width: 200px;
            margin-right: 20px;
        }

        div:hover {
            background-color: #d6e7a5;
        }
    </style>
</head>
<body>
    <div id="d1">01</div>
    <div id="d2">02</div>
    <div id="d3">03</div>
</body>
</html>
